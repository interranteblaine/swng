packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

catalog:
  typescript: ^5.9.3
  vitest: ^4.0.9
  "@types/node": ^22.7.9
  fast-check: ^4.0.0
  "fake-indexeddb": ^6.0.0
